name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Testy znanych bledow (Category=KnownBug) sa pomijane w CI, dopoki bledy nie zostana naprawione.
      # Gdy wszystkie BUG-xx beda naprawione - usunac czesc --filter.
      - name: Run tests
        run: dotnet test UniBoard.Tests/UniBoard.Tests.csproj --configuration Release --filter "Category!=KnownBug"
